<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Agent policy overlap</title><desc id="d">Permission, fresh evidence, and known effect state overlap to allow an action.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="58" y="64" fill="#71716a" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">AGENT POLICY</text>
<text x="58" y="108" fill="#171714" font-family="Georgia,serif" font-size="35">An action exists only in the overlap.</text>
<circle cx="455" cy="292" r="155" fill="#e4edb0" fill-opacity=".82" stroke="#596e35" stroke-width="2"/>
<circle cx="625" cy="292" r="155" fill="#dce9de" fill-opacity=".82" stroke="#4f7555" stroke-width="2"/>
<circle cx="540" cy="385" r="155" fill="#f1d9dc" fill-opacity=".82" stroke="#a4243b" stroke-width="2"/>
<text x="390" y="245" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">permission</text><text x="390" y="272" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="15">scope · origin · mode</text>
<text x="690" y="245" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">fresh evidence</text><text x="690" y="272" text-anchor="middle" fill="#4e4e48" font-family="Arial,sans-serif" font-size="15">review still valid</text>
<text x="540" y="452" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">known effect state</text>
<circle cx="540" cy="326" r="48" fill="#171714"/><text x="540" y="332" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">ALLOW</text>
<rect x="880" y="220" width="250" height="118" rx="18" fill="#fff" stroke="#d8d8d1" stroke-width="2"/><text x="905" y="255" fill="#a4243b" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">OUTSIDE THE OVERLAP</text><text x="905" y="288" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">deny or stop</text><text x="905" y="316" fill="#71716a" font-family="Arial,sans-serif" font-size="14">ambiguity never widens permission</text>
</svg>